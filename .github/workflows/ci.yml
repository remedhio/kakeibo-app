name: CI

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://ci.example.test
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ci-test-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
      - run: npm ci
      - run: npm run validate:schema
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
